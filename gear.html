  <style>
    body {
      background: #000;
      min-height: 100vh;
    }

    .gear-teaser {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 20px 80px;
      position: relative;
      overflow: hidden;
    }

    .gear-teaser::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(0, 212, 255, 0.03) 0%, transparent 70%);
      pointer-events: none;
    }

    .teaser-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #00d4ff;
      margin-bottom: 2rem;
      opacity: 0.8;
    }

    .teaser-title {
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .teaser-subtitle {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      color: #334155;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 4rem;
    }

    .teaser-line {
      width: 1px;
      height: 120px;
      background: linear-gradient(to bottom, #00d4ff, transparent);
      margin-bottom: 2rem;
    }

    .teaser-status {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.1em;
    }

    .teaser-status span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #00d4ff;
      border-radius: 50%;
      margin-right: 8px;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* Scanline effect */
    .gear-teaser::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.1) 2px,
        rgba(0, 0, 0, 0.1) 4px
      );
      pointer-events: none;
      opacity: 0.3;
    }
  </style>
</head>

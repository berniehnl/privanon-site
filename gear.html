    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background: #000;
            min-height: 100vh;
        }

        .gear-teaser {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 80px;
            position: relative;
            overflow: hidden;
        }

        .gear-teaser::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.03) 0%, transparent 70%);
            pointer-events: none;
        }

        .teaser-tag {
            font-family: var(--font-mono);
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            color: var(--color-accent-light);
            margin-bottom: 2rem;
            opacity: 0.8;
        }

        .teaser-title {
            font-size: clamp(3rem, 10vw, 8rem);
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #fff;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .teaser-subtitle {
            font-family: var(--font-mono);
            font-size: 1rem;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            margin-bottom: 4rem;
        }

        .teaser-line {
            width: 1px;
            height: 120px;
            background: linear-gradient(to bottom, var(--color-accent), transparent);
            margin-bottom: 2rem;
        }

        .teaser-status {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--color-text-muted);
            letter-spacing: 0.1em;
        }

        .teaser-status span {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: var(--color-accent);
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Scanline effect */
        .gear-teaser::after {
            content: '';
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.1) 2px,
                rgba(0, 0, 0, 0.1) 4px
            );
            pointer-events: none;
            opacity: 0.3;
        }
    </style>
</head>

                PRIVANON
                <span class="logo-division">A Division of BKW</span>

            <ul class="nav-links">
                <li><a href="index.html#solutions">Capabilities</a></li>
                <li><a href="index.html#technology">Technology</a></li>
                <li><a href="insights.html">Insights</a></li>
                <li><a href="leadership.html">Leadership</a></li>
                <li><a href="index.html#contact" class="nav-cta">Contact</a></li>
            </ul>
            <button class="mobile-menu-btn" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </nav>

    <section class="gear-teaser">
        <div class="teaser-tag">Classified // Gear Division</div>
        <h1 class="teaser-title">GEAR</h1>
        <div class="teaser-subtitle">Coming Soon</div>

    </section>

    <!-- Footer -->

</body>

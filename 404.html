    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: var(--color-bg-primary);
            position: relative;
            overflow: hidden;
        }
        .error-content {
            position: relative;
            z-index: 2;
            padding: 2rem;
        }
        .error-code {
            font-family: var(--font-mono);
            font-size: 8rem;
            font-weight: 700;
            color: var(--color-bg-card);
            -webkit-text-stroke: 2px var(--color-accent);
            opacity: 0.5;
            margin-bottom: 1rem;
            animation: glitch 3s infinite;
        }
        .error-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--color-text-primary);
        }
        .error-desc {
            font-size: 1.125rem;
            color: var(--color-text-secondary);
            margin-bottom: 2.5rem;
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .radar-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 800px;
            height: 800px;
            border: 1px solid rgba(59, 130, 246, 0.05);
            border-radius: 50%;
            pointer-events: none;
        }
        .radar-bg::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: conic-gradient(from 0deg, transparent 0deg, rgba(59, 130, 246, 0.05) 360deg);
            animation: radar-sweep 10s linear infinite;
        }
        @keyframes glitch {
            0% { transform: translate(0); }
            2% { transform: translate(-2px, 2px); }
            4% { transform: translate(2px, -2px); }
            6% { transform: translate(0); }
            100% { transform: translate(0); }
        }
    </style>
</head>
